<svg xmlns="http://www.w3.org/2000/svg" class="case-sketch-art" width="400" height="220" viewBox="0 0 400 220" stroke-linecap="round" stroke-linejoin="round"><style>:root{--sketch-line:#505861;--sketch-seam:#d5d9de;--accent:#075b53;--dataset-head:#edf2f0;--paper:#fff;background:#f7f9f8;color:var(--accent)}@media(prefers-color-scheme:dark){:root{--sketch-line:#aab7bc;--sketch-seam:#34484b;--accent:#7ed1bd;--dataset-head:#25383b;--paper:#1e2a30;background:#182126}}.case-sketch-art :is(.sketch-ink, .sketch-fill, .sketch-face, .sketch-side, .sketch-detail, .sketch-wire, .sketch-accent) {
