<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" class="hospital-atlas-art"><style>
.hospital-atlas-art{--paper:#fff;--muted:#4d5855;--rule:#b0bbb5;--accent:#08695f;--dataset-head:#e4eeea;color:var(--accent);fill:none;stroke:var(--muted);stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.hospital-atlas-ground,.hospital-atlas-face{fill:var(--dataset-head)}
.hospital-atlas-ground-side,.hospital-atlas-side{fill:var(--rule)}
.hospital-atlas-roof{fill:var(--paper);stroke:var(--accent);stroke-width:1.7}
.hospital-atlas-grid{opacity:.24}
.hospital-atlas-pin{stroke:currentColor;fill:none;stroke-width:1.6}
.hospital-atlas-site-outline{fill:color-mix(in srgb,var(--accent) 18%,var(--paper));stroke:var(--accent);stroke-width:1.9;stroke-dasharray:4 2;}
@media(prefers-color-scheme:dark){.hospital-atlas-art{--paper:#111816;--muted:#b7c7c1;--rule:#465851;--accent:#89dfcf;--dataset-head:#23352f}}
</style><g><polygon class="hospital-atlas-ground" points="130.0,16.0 350.0,16.0 350.0,236.0 130.0,236.0"></polygon><polyline class="hospital-atlas-grid" points="174.0,16.0 174.0,236.0"></polyline><polyline class="hospital-atlas-grid" points="130.0,60.0 350.0,60.0"></polyline><polyline class="hospital-atlas-grid" points="218.0,16.0 218.0,236.0"></polyline><polyline class="hospital-atlas-grid" points="130.0,104.0 350.0,104.0"></polyline><polyline class="hospital-atlas-grid" points="262.0,16.0 262.0,236.0"></polyline><polyline class="hospital-atlas-grid" points="130.0,148.0 350.0,148.0"></polyline><polyline class="hospital-atlas-grid" points="306.0,16.0 306.0,236.0"></polyline><polyline class="hospital-atlas-grid" points="130.0,192.0 350.0,192.0"></polyline><polygon class="hospital-atlas-roof" points="160.8,110.8 194.3,105.3 205.2,138.3 216.2,134.6 227.3,130.9 217.4,101.5 306.6,87.0 319.2,121.7 274.7,136.5 265.7,139.5 224.0,153.4 215.5,156.2 189.1,165.0 185.7,155.3 177.9,158.3 174.0,147.5"></polygon></g></svg>
