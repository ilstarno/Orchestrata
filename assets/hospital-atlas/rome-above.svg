.hospital-atlas-site-outline{fill:color-mix(in srgb,var(--accent) 18%,var(--paper));stroke:var(--accent);stroke-width:1.9;stroke-dasharray:4 2;}
@media(prefers-color-scheme:dark){.hospital-atlas-art{--paper:#111816;--muted:#b7c7c1;--rule:#465851;--accent:#89dfcf;--dataset-head:#23352f}}
