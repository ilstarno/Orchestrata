[package]
name = "orchestrata-application"
version = "0.1.0"
edition.workspace = true

[features]
openapi = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json = "1"
utoipa = { version = "5", optional = true }
orchestrata-hygiene = { path = "../hygiene" }
orchestrata-solver = { path = "../solver" }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "solve_reliability"
path = "../../../backend_tests/application/solve_reliability.rs"

[[test]]
name = "lead_conversion_replay"
path = "../../../backend_tests/application/lead_conversion_replay.rs"
