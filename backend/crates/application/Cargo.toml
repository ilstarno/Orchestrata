[package]
name = "orchestrata-application"
version = "0.1.0"
edition.workspace = true

[features]
openapi = ["dep:utoipa"]

[dependencies]
sha2 = "0.11.1"
orchestrata-recipe-package = { git = "https://github.com/ilstarno/orchestrata-engine.git", rev = "774bd0f1c17ef0f8d16bacc0b0cb016b075dcc12" }
orchestrata-recipe-runtime = { git = "https://github.com/ilstarno/orchestrata-engine.git", rev = "774bd0f1c17ef0f8d16bacc0b0cb016b075dcc12" }
serde.workspace = true
serde_json = "1"
utoipa = { version = "5", optional = true }
orchestrata-hygiene = { path = "../hygiene" }
orchestrata-solver = { path = "../solver" }
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "solve_reliability"
path = "../../../backend_tests/application/solve_reliability.rs"

[[test]]
name = "lead_conversion_replay"
path = "../../../backend_tests/application/lead_conversion_replay.rs"

[[test]]
name = "recipe_package_execution"
path = "../../../backend_tests/application/recipe_package_execution.rs"

[[test]]
name = "recipe_package_penalty_v2"
path = "../../../backend_tests/application/recipe_package_penalty_v2.rs"
