[package]
name = "orchestrata-application"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde.workspace = true
sha2 = "0.11.1"
orchestrata-recipe-package = { git = "https://github.com/ilstarno/orchestrata-engine.git", rev = "ecde611cea4ba9995dc6108855ae0505ab3bc05d" }
orchestrata-recipe-runtime = { git = "https://github.com/ilstarno/orchestrata-engine.git", rev = "ecde611cea4ba9995dc6108855ae0505ab3bc05d" }
orchestrata-hygiene = { path = "../hygiene" }
orchestrata-solver = { path = "../solver" }
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "solve_reliability"
path = "../../../backend_tests/application/solve_reliability.rs"

[[test]]
name = "recipe_package_execution"
path = "../../../backend_tests/application/recipe_package_execution.rs"
