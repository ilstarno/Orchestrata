[package]
name = "orchestrata-mcp"
version = "0.1.0"
edition.workspace = true

[dependencies]
orchestrata-application = { path = "../application" }
orchestrata-recipes = { path = "../recipes" }
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "process", "time"] }

[[test]]
name = "stdio"
path = "../../../backend_tests/mcp/stdio.rs"
