[workspace]
members = [
    "crates/core",
    "crates/domain",
    "crates/solver",
    "crates/hygiene",
    "crates/reports",
    "crates/imports",
    "crates/recipes",
    "crates/mcp",
    "crates/application",
    "crates/api",
    "crates/cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
