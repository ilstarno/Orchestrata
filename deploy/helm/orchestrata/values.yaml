imagePullSecrets: []

api:
  replicas: 1
  image: orchestrata-api:dev
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

web:
  replicas: 1
  image: orchestrata-web:dev
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
